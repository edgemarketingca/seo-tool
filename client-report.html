<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="referrer" content="no-referrer"/>
<meta name="robots" content="noindex"/>
<title>Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600&display=swap" rel="stylesheet"/>
<style>
/* Same palette as the SEO tool. */
:root{
  --brand:#e87722; --brand-deep:#b8570f; --brand-wash:#fdf1e6;
  --paper:#f3f6f8; --card:#ffffff; --card-2:#f7f9fa; --line:#e4e9ed; --line-2:#eef2f5;
  --ink:#1b222a; --ink-2:#57646f; --ink-3:#8b98a3;
  --good:#0f7a58; --good-wash:#e6f5ef; --alert:#b5352a;
  --ui:"Geist","Inter",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --display:"Poppins","Inter",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono","SFMono-Regular",Consolas,monospace;
}
/* AgencyAnalytics page: #FDFDFD, Geist. The report itself is styled by reports.js (.rp-aa). */
html,body{margin:0;background:#FDFDFD;color:#555;font-family:"Geist","Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;}
#report{max-width:1280px;margin:0 auto;padding:24px 16px 40px;}
.foot{max-width:1280px;margin:0 auto;padding:0 16px 28px;color:#8A949C;font-size:11.5px;}
</style>
</head>
<body>
<main id="report"></main>
<div class="foot" id="foot"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="ai-visibility.js"></script>
<script src="reports.js"></script>
<script>
(function(){
  'use strict';
  const root = document.getElementById('report'), foot = document.getElementById('foot');
  const AIV = window.AIVis, ER = window.EdgeReports;
  const id = new URLSearchParams(location.search).get('r') || '';
  if (!AIV || !ER){ root.textContent = 'This report could not load.'; return; }
  if (!/^clientreport-[\w-]+$/.test(id)){ AIV.renderMessage(root, 'Report not found', 'This link is missing its report id.', true); return; }

  let db = null;
  try{
    firebase.initializeApp({
      apiKey: "AIzaSyA94BzMWcwqlK9Bpmclw6l0hSDiyPhQ_AA",
      authDomain: "serp-79020.firebaseapp.com",
      projectId: "serp-79020",
      storageBucket: "serp-79020.firebasestorage.app",
      messagingSenderId: "760216876354",
      appId: "1:760216876354:web:27c96045159c7920af44db"
    });
    db = firebase.firestore();
  }catch(e){ db = null; }

  AIV.renderMessage(root, 'Loading report', 'Fetching the latest numbers…');

  (async () => {
    if (!db) throw new Error('This report needs an internet connection to load.');
    const snapDoc = await db.collection('publicViews').doc(id).get();
    if (!snapDoc.exists) throw new Error('This report link is no longer available. Please ask EDGE Marketing for the current link.');
    const view = snapDoc.data() || {};
    if (view.type === 'revoked') throw new Error('This report link is no longer available. Please ask EDGE Marketing for the current link.');
    if (view.type !== 'clientreport') throw new Error('This report link is not set up correctly.');
    let items = [];
    /* Layout positions are numbers; anything else is dropped and the widget is placed automatically. */
    const pos = v => { const n = Number(v); return v != null && v !== '' && isFinite(n) ? n : undefined; };
    try{ items = JSON.parse(view.layout || '[]').filter(i => i && ER.W[i.type] && !ER.W[i.type].internal).map(i => {
      const o = {id: String(i.id || ''), type: i.type, size: ['s', 'm', 'l', 'xl'].indexOf(i.size) > -1 ? i.size : 'l', cfg: i.cfg && typeof i.cfg === 'object' ? i.cfg : {}};
      ['cols', 'h', 'x', 'y'].forEach(k => { const n = pos(i[k]); if (n != null) o[k] = n; });
      if (o.cfg.off && !Array.isArray(o.cfg.off)) delete o.cfg.off;
      return o;
    }); }catch(e){}
    /* Form widgets set to let the client click into submissions on this link: the secret goes with every forms request (the tracker checks it). */
    const fxCs = (items.find(i => /^(forms|easyleads_forms|forms_[a-z_]+|el_[a-z_]+)$/.test(i.type) && i.cfg && i.cfg.contacts && /^[a-f0-9]{32}$/.test(String(i.cfg.cs || ''))) || {cfg: {}}).cfg.cs || '';
    let snap = null;
    try{ if (view.snap) snap = JSON.parse(view.snap); }catch(e){}
    document.title = view.title || 'Report';
    const parse = (x, d) => { try{ return x ? JSON.parse(x) : d; }catch(e){ return d; } };
    /* Only the periods the team allowed; the first one when the stored one isn't among them. */
    const periods = (Array.isArray(view.periods) && view.periods.length ? view.periods : ER.CLIENT_PERIODS_DEFAULT).filter(ER.validPeriod);
    if (!periods.length) periods.push('lastMonth');
    const num = v => { if (v == null || v === '') return null; const n = Number(v); return isFinite(n) ? n : null; };
    /* Shared documents are data: numbers are forced to numbers, links and colours are checked. */
    const kwStored = Array.isArray(parse(view.kw, null)) && parse(view.kw, []).filter(r => r && typeof r === 'object').map(r => ({kw: String(r.kw || ''), loc: String(r.loc || ''),
      rank: num(r.rank), prev: num(r.prev), at: num(r.at) || 0, url: /^https?:\/\//i.test(String(r.url || '')) ? String(r.url) : '',
      hist: (Array.isArray(r.hist) ? r.hist : []).map(h => [num(h && h[0]), num(h && h[1])])}));
    const gbpStored = Array.isArray(parse(view.gbp, null)) && parse(view.gbp, []).filter(g => g && typeof g === 'object').map(g => ({name: String(g.name || ''), biz: String(g.biz || ''),
      kws: (Array.isArray(g.kws) ? g.kws : []).filter(k => k && k.last).map(k => {
        const st = s => s && typeof s === 'object' ? {ts: num(s.ts), n: num(s.n) || 0, found: num(s.found) || 0, top3: num(s.top3) || 0, avg: num(s.avg), grid: Math.min(15, num(s.grid) || 0),
          pts: (Array.isArray(s.pts) ? s.pts : []).map(p => [num(p && p[0]), num(p && p[1]), num(p && p[2])])} : null;
        return {kw: String(k.kw || ''), last: st(k.last), prev: st(k.prev)};
      })}));
    const brand = parse(view.brand, {}) || {};
    if (!/^#[0-9a-f]{3,8}$/i.test(String(brand.accent || ''))) brand.accent = '';
    brand.logoH = Math.max(20, Math.min(120, num(brand.logoH) || 44));
    const okImg = u => /^(https:\/\/|data:image\/(png|jpe?g|gif|webp);)/i.test(String(u || '')) ? String(u) : '';
    /* Live numbers only from the EDGE tracker (Google Apps Script), never another server. */
    if (view.feedUrl && !/^https:\/\/script\.google(usercontent)?\.com\//.test(String(view.feedUrl))){ view.feedUrl = ''; view.token = ''; }
    if (brand.accent) document.documentElement.style.setProperty('--brand', brand.accent);

    let period = periods.indexOf(view.period) > -1 ? view.period : periods[0];
    const live = {feed: null, people: null, g4: {}, gsc: {}, pages: {}, pg: {}, pathway: {}, pw: {}, forms: {}, easyleads: {}, formsc: {}, gsch: {}};
    /* Stored copy for the period the report was published with; live numbers (read-only token) for everything else. */
    const ctxFor = () => {
      const ctx = {domain: view.domain, clientName: view.clientName || '', cms: String(view.cms || '')};
      const fromSnap = n => snap && snap[n] && snap.period === period ? snap[n] : null;
      const canLive = !!(view.feedUrl && view.token);
      ctx.get = name => {
        if (name === 'kw' && kwStored) return Promise.resolve(kwStored);
        if (name === 'gbp' && gbpStored) return Promise.resolve(gbpStored);
        if (name === 'kw' || name === 'gbp') return snap && snap[name] ? Promise.resolve(snap[name]) : Promise.reject(new Error('Not available yet.'));
        if (name === 'feed'){
          if (live.feed) return live.feed;
          if (snap && snap.feed && !canLive) return Promise.resolve(snap.feed);
          if (!canLive) return Promise.reject(new Error('Not available.'));
          live.feed = AIV.apiGet(view.feedUrl, {action: 'feed', domain: view.domain, t: view.token}).catch(e => { live.feed = null; if (snap && snap.feed) return snap.feed; throw e; });
          return snap && snap.feed ? Promise.resolve(snap.feed) : live.feed;
        }
        /* Every form submission on file, website and Easyleads, all time (Forms on this site): form, page and date only. */
        if (name === 'people'){
          if (!canLive) return Promise.reject(new Error('Not available.'));
          if (live.people) return live.people;
          /* The token reads about two years back; anything older came with the report when it was published. */
          const end = new Date().toISOString().slice(0, 10), start = new Date(Date.now() - 728 * 864e5).toISOString().slice(0, 10);
          const old = (snap && Array.isArray(snap.peopleOld) ? snap.peopleOld : []).filter(a => Array.isArray(a) && String(a[0]).slice(0, 10) < start)
            .map(a => ({t: String(a[0]), form: String(a[1] || ''), page: String(a[2] || ''), test: !!a[4], _src: a[3] ? 'el' : 'web'}));
          const one = src => AIV.apiGet(view.feedUrl, Object.assign({action: 'forms', domain: view.domain, t: view.token, start, end}, src ? {src} : {})).then(r => (r && !r.error ? r : null), () => null);
          return live.people = Promise.all([one(''), one('easyleads')]).then(res => {
            if (!res[0] && !res[1] && !old.length){ live.people = null; throw new Error('Not available.'); }
            const tag = (x, src) => (x && Array.isArray(x.rows) ? x.rows : []).filter(r => r && r.t).map(r => ({t: String(r.t), form: String(r.form || ''), page: String(r.page || ''), test: r.test, _src: src}));
            return {rows: old.concat(tag(res[0], 'web'), tag(res[1], 'el')), details: false};
          });
        }
        const R = ctx.R;
        if (name === 'pathway'){
          const stored = fromSnap('pathway');
          if (!canLive) return stored ? Promise.resolve(stored) : Promise.reject(new Error('Not available.'));
          const p = ctx.loadPathway('all');
          return stored ? Promise.resolve(stored) : p;
        }
        if (!live[name]) return Promise.reject(new Error('Not available.'));
        const k = name === 'g4' || name === 'forms' || name === 'formsc' || name === 'easyleads' ? R.prevSince + '|' + R.end : name === 'pages' ? R.prevSince + '|' + R.since + '|' + R.end : R.since + '|' + R.end;
        const stored = fromSnap(name);
        if (live[name][k]) return live[name][k];
        if (!canLive) return stored ? Promise.resolve(stored) : Promise.reject(new Error('Not available.'));
        const p = AIV.apiGet(view.feedUrl, name === 'g4'
          ? {action: 'ga4report', domain: view.domain, t: view.token, start: R.prevSince, end: R.end}
          : name === 'gsch'
          ? {action: 'gscHealth', domain: view.domain, t: view.token, start: R.since, end: R.end}
          : name === 'forms'
          ? Object.assign({action: 'forms', domain: view.domain, t: view.token, start: R.prevSince, end: R.end}, fxCs ? {cs: fxCs} : {})
          : name === 'formsc'
          ? Object.assign({action: 'forms', domain: view.domain, t: view.token, start: R.prevSince, end: R.end}, fxCs ? {cs: fxCs} : {})
          : name === 'easyleads'
          ? Object.assign({action: 'forms', src: 'easyleads', domain: view.domain, t: view.token, start: R.prevSince, end: R.end}, fxCs ? {cs: fxCs} : {})
          : name === 'pages'
          ? {action: 'pages', domain: view.domain, t: view.token, start: R.prevSince, split: R.since, end: R.end}
          : {action: 'gscQueries', domain: view.domain, t: view.token, start: R.since, end: R.end})
          .catch(e => { delete live[name][k]; if (stored) return stored; throw e; });
        live[name][k] = p;
        return stored ? Promise.resolve(stored) : p;
      };
      /* One page, day by day (Page performance widget), with the report's read-only token. */
      /* Pathways for a traffic type and a place, with the report's read-only token. */
      if (canLive) ctx.loadPathway = (ch, geo) => {
        const R = ctx.R, k = R.since + '|' + R.end + '|' + (ch || 'all') + '|' + (geo || '');
        return live.pw[k] || (live.pw[k] = AIV.apiGet(view.feedUrl, Object.assign({action: 'pathway', domain: view.domain, t: view.token, start: R.since, end: R.end, channel: ch || 'all'}, geo ? {geo: String(geo).slice(0, 90)} : {}))
          .then(r => { if (r && r.error) throw new Error(r.error === 'busy, try again in a few minutes' ? 'Too many changes at once. Wait a minute and try again.' : r.error); return r; })
          .catch(e => { delete live.pw[k]; throw e; }));
      };
      if (canLive) ctx.loadPage = path => {
        const R = ctx.R, k = R.since + '|' + R.end + '|' + path;
        return live.pg[k] || (live.pg[k] = AIV.apiGet(view.feedUrl, {action: 'pages', domain: view.domain, t: view.token, start: R.prevSince, split: R.since, end: R.end, path: String(path).slice(0, 300)})
          .catch(e => { delete live.pg[k]; throw e; }));
      };
      return ctx;
    };
    const draw = () => {
      ER.renderBoard(root, {mode: 'public', title: view.title, items, period, ctx: ctxFor(), editable: false, drill: view.drill === true,
        periods, lockNote: true, showDates: view.showDates !== false, bare: !!view.single, brand, clientLogo: okImg(view.clientLogo), agencyLogo: okImg(view.agencyLogo), clientName: view.clientName || '',
        emptyHtml: '<h3>This report is being prepared</h3>Check back soon.',
        onPeriod: p => { if (periods.indexOf(p) < 0) return; period = p; draw(); }});
    };
    draw();
    const at = snap && snap.at ? snap.at : view.updatedAt;
    foot.textContent = (view.single ? (view.clientName ? view.clientName + ' · ' : '') + ER.rangeOf(period).text + ' · ' : '') + (at ? 'Updated ' + new Date(at).toLocaleString('en-CA', {dateStyle: 'medium', timeStyle: 'short'}) + ' · Numbers refresh automatically' : '');

    /* Once live numbers for the shown period arrive, redraw with them. */
    if (view.feedUrl && view.token){
      const ctx = ctxFor(); ctx.R = ER.rangeOf(period);
      const needs = new Set(); items.forEach(i => (ER.W[i.type].needs || []).forEach(n => needs.add(n)));
      const waits = [];
      if (needs.has('feed')) waits.push(ctx.get('feed') && live.feed);
      if (needs.has('g4')){ ctx.get('g4'); waits.push(live.g4[ctx.R.prevSince + '|' + ctx.R.end]); }
      if (needs.has('gsc')){ ctx.get('gsc'); waits.push(live.gsc[ctx.R.since + '|' + ctx.R.end]); }
      if (needs.has('forms')){ ctx.get('forms'); waits.push(live.forms[ctx.R.prevSince + '|' + ctx.R.end]); }
      if (needs.has('easyleads')){ ctx.get('easyleads'); waits.push(live.easyleads[ctx.R.prevSince + '|' + ctx.R.end]); }
      if (needs.has('formsc')){ ctx.get('formsc'); waits.push(live.formsc[ctx.R.prevSince + '|' + ctx.R.end]); }
      if (needs.has('pages')){ ctx.get('pages'); waits.push(live.pages[ctx.R.prevSince + '|' + ctx.R.since + '|' + ctx.R.end]); }
      if (snap && waits.length) Promise.allSettled(waits.filter(Boolean)).then(() => { snap = Object.assign({}, snap, {period: '__live'}); draw(); });
    }
  })().catch(err => {
    AIV.renderMessage(root, 'This report couldn’t load', String(err && err.message || err).replace(/[&<>]/g, ''), true);
  });
})();
</script>
</body>
</html>
